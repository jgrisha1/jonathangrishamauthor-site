name: Sync Books from Amazon

on:
  # Run nightly at 3am ET (8am UTC)
  schedule:
    - cron: '0 8 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run book sync script
        env:
          AMAZON_CLIENT_ID:     ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG:   ${{ secrets.AMAZON_PARTNER_TAG }}
          BOOK_SYNC_REPORT:     ${{ runner.temp }}/book-sync-candidates.json
        run: node scripts/sync-books.js

      - name: Add review summary
        run: |
          node -e "const r=require(process.env.BOOK_SYNC_REPORT); console.log('## Amazon book discovery\n\nKnown catalog: **'+r.knownBookCount+'**  \nDiscovered: **'+r.discoveredBookCount+'**  \nCandidates requiring review: **'+r.candidateCount+'**\n'); if(r.candidates.length){console.log(r.candidates.map(b=>'- '+b.title+' ('+b.asin+')').join('\n'));}" >> "$GITHUB_STEP_SUMMARY"
        env:
          BOOK_SYNC_REPORT: ${{ runner.temp }}/book-sync-candidates.json

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: book-sync-candidates
          path: ${{ runner.temp }}/book-sync-candidates.json
          retention-days: 30
